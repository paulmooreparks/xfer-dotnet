name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The xfer-js CLI the differential tests compare against (DESIGN.md section 12.6), at the
      # release named in xfer-js.version.
      - name: Install xfer-js
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/xfer-js" "xferlang@$(cat xfer-js.version)"
          cli="$RUNNER_TEMP/xfer-js/node_modules/xferlang/dist/cli.mjs"
          test -f "$cli"
          echo "XFER_JS_CLI=$cli" >> "$GITHUB_ENV"
          echo "XFER_DIFFERENTIAL_REQUIRED=1" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts
