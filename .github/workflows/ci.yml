name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The xfer-js CLI the differential tests compare against (DESIGN.md section 12.6): the release
      # on the first line of xfer-js.version, whose tarball must have the integrity on the second.
      # The package has no dependencies and no install scripts, and none are run.
      - name: Install xfer-js
        shell: bash
        run: |
          version="$(sed -n 1p xfer-js.version)"
          expected="$(sed -n 2p xfer-js.version)"
          mkdir -p "$RUNNER_TEMP/xfer-js"
          npm pack "xferlang@$version" --pack-destination "$RUNNER_TEMP/xfer-js"
          tarball="$RUNNER_TEMP/xfer-js/xferlang-$version.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          test "$actual" = "$expected" || { echo "xferlang@$version is $actual, not $expected"; exit 1; }
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/xfer-js" "$tarball"
          cli="$RUNNER_TEMP/xfer-js/node_modules/xferlang/dist/cli.mjs"
          test -f "$cli"
          echo "XFER_JS_CLI=$cli" >> "$GITHUB_ENV"
          echo "XFER_DIFFERENTIAL_REQUIRED=1" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts
